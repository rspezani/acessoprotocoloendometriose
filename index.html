<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protocolo Natural Endometriose</title>

<script src="https://cdn.jsdelivr.net/npm/turn.js@4/turn.min.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<style>
body{
    margin:0;
    background:#efe7f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

#flipbook{
    width:900px;
    height:650px;
}

#flipbook .page{
    background:white;
    background-size:cover;
    background-position:center;
}

@media(max-width:900px){
    #flipbook{
        width:100vw;
        height:80vh;
    }
}
</style>
</head>

<body>

<div id="flipbook">
    <div class="page" style="background-image:url('pages/page1.jpg')"></div>
    <div class="page" style="background-image:url('pages/page2.jpg')"></div>
    <div class="page" style="background-image:url('pages/page3.jpg')"></div>
    <div class="page" style="background-image:url('pages/page4.jpg')"></div>
    <div class="page" style="background-image:url('pages/page5.jpg')"></div>
    <div class="page" style="background-image:url('pages/page6.jpg')"></div>
    <div class="page" style="background-image:url('pages/page7.jpg')"></div>
    <div class="page" style="background-image:url('pages/page8.jpg')"></div>
    <div class="page" style="background-image:url('pages/page9.jpg')"></div>
    <div class="page" style="background-image:url('pages/page10.jpg')"></div>
    <div class="page" style="background-image:url('pages/page11.jpg')"></div>
    <div class="page" style="background-image:url('pages/page12.jpg')"></div>
</div>

<script>
$("#flipbook").turn({
    width: 900,
    height: 650,
    autoCenter: true,
    gradients: true,
    acceleration: true,
    elevation: 50
});
</script>

</body>
</html>
